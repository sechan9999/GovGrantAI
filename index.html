<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GovAI - US Grant Proposal Generator</title>
    <!-- SEO Best Practices -->
    <meta name="description" content="Generate high-quality US government grant proposals instantly using AI. Build winning narratives with our state-of-the-art proposal generator." />
    <!-- Modern Typography: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Background Elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="app-container">
      <header class="app-header">
        <div class="logo-container">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <defs>
              <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4f46e5" />
                <stop offset="100%" stop-color="#c026d3" />
              </linearGradient>
            </defs>
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
          <h1>GovAI <span class="badge">PRO</span></h1>
        </div>
        <p class="subtitle">AI-Powered US Federal Grant Proposal Architect</p>
      </header>

      <main class="main-layout">
        <!-- Left Panel: Input Form -->
        <section class="panel input-panel glass-card">
          <div class="panel-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
              <h2>Project Details</h2>
              <p>Provide the core details of your initiative.</p>
            </div>
            <button type="button" id="sample-btn" class="btn-secondary" style="font-size: 0.8rem; padding: 0.5rem 1rem; border-radius: var(--radius-sm); background: var(--glass-highlight); border: 1px solid var(--glass-border); color: var(--text-primary); cursor: pointer; transition: var(--transition);">
              Fill Sample Data
            </button>
          </div>
          <form id="proposal-form" class="proposal-form">
            <div class="form-group">
              <label for="orgName">Organization Name</label>
              <input type="text" id="orgName" placeholder="e.g., Nexus Innovations" required />
            </div>
            
            <div class="form-group">
              <label for="projectTitle">Project Title</label>
              <input type="text" id="projectTitle" placeholder="e.g., Community Tech Access Initiative" required />
            </div>

            <div class="form-row">
              <div class="form-group half">
                <label for="fundingAmount">Requested Funding ($)</label>
                <input type="number" id="fundingAmount" placeholder="e.g., 500000" required />
              </div>
              <div class="form-group half">
                <label for="grantAgency">Target Agency</label>
                <select id="grantAgency" required>
                  <option value="" disabled selected>Select Agency...</option>
                  <option value="NSF">National Science Foundation (NSF)</option>
                  <option value="NIH">National Institutes of Health (NIH)</option>
                  <option value="DOE">Department of Energy (DOE)</option>
                  <option value="ED">Department of Education (ED)</option>
                  <option value="OTHER">Other / State Level</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="objectives">Core Objectives & Impact</label>
              <textarea id="objectives" rows="3" placeholder="Briefly describe the problem you are solving and the measurable outcomes of this grant..." required></textarea>
            </div>

            <div class="form-group">
              <label for="pastPerformance">Past Performance / Track Record</label>
              <textarea id="pastPerformance" rows="3" placeholder="Describe past successes, prior grants managed, or institutional capabilities..." required></textarea>
            </div>

            <button type="submit" class="btn-primary" id="generate-btn">
              <span class="btn-text">Generate Proposal</span>
              <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </form>
        </section>

        <!-- Right Panel: Output & AI Generation -->
        <section class="panel output-panel glass-card" id="output-panel">
          
          <!-- Empty State -->
          <div class="empty-state" id="empty-state">
            <div class="empty-icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <h3>Ready to Generate</h3>
            <p>Fill out the form to synthesize a comprehensive grant proposal.</p>
          </div>

          <!-- Loading State -->
          <div class="loading-state hidden" id="loading-state">
            <div class="spinner-container">
              <div class="spinner"></div>
              <div class="spinner-inner"></div>
            </div>
            <h3 class="loading-text">Synthesizing AI Proposal...</h3>
            <div class="progress-bar-container">
              <div class="progress-bar" id="progress-bar"></div>
            </div>
            <p class="loading-step" id="loading-step">Analyzing agency requirements...</p>
          </div>

          <!-- Result State -->
          <div class="result-state hidden" id="result-state">
            <div class="result-header">
              <h2>Generated Proposal</h2>
              <div class="action-buttons" style="display: flex; gap: 0.5rem;">
                <button class="btn-icon-only" id="download-md-btn" title="Download Markdown">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
                <button class="btn-icon-only" id="download-pdf-btn" title="Download PDF">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </button>
                <button class="btn-icon-only" id="copy-btn" title="Copy to Clipboard">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
              </div>
            </div>
            <div class="document-content" id="document-content">
              <!-- Content injected via JS -->
            </div>
          </div>

        </section>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
